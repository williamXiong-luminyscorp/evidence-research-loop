interface:
  display_name: "证据驱动的方案进化"
  short_description: "自动运行可恢复的多代方案搜索，并可启用 Scientist Mode 编排科研流程"
  default_prompt: "使用 $evidence-research-loop 把当前目标定义成可执行 solution 搜索：固定任务适配器、基线、裁判和预算，自动生成并评测多代候选，维护谱系、Pareto、多样性与失败档案，冻结后做独立测试并导出可复核证据。若目标是提出假设、查证新颖性、运行研究实验并形成论文式结果，启用 Scientist Mode 的构想、文献、实验树、科学分析及论文评审五个模块。"
policy:
  allow_implicit_invocation: true
